      <stop offset="0%" stop-color="#F5FAF2"/>
      <stop offset="100%" stop-color="#E7F2E5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9EAD2"/>
      <stop offset="100%" stop-color="#AFC9A8"/>
